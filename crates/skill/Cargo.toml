[package]
name = "skill"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Skill packaging and parsing library for .skill/.zip files"
# `std::fs::File::lock` (the interprocess mutation lock in src/lock/guard.rs)
# stabilized in 1.89. Declared so an older toolchain fails with an MSRV message
# instead of "no method named `lock`". Every other crate reaches this one, so
# declaring it here covers a workspace build.
rust-version = "1.89"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
zip = "8.0"
tempfile = { workspace = true }
skills-ref = { git = "https://github.com/AkaraChen/skills-ref" }
walkdir = "2.5"
chrono = { version = "0.4", features = [ "serde" ] }
dirs = { workspace = true }
log = "0.4.31" # same version aghub-core pins; already in the tree
ignore = "0.4"
sha2 = "0.10"
feruca = "0.11"   # UCA collation; close to JS localeCompare but not identical

[dev-dependencies]
tempfile = { workspace = true }
