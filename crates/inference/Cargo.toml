[package]
name = "aghub-inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Inference provider configuration storage for aghub"

[dependencies]
aghub-json = { path = "../json" }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
log = "0.4.31"
dirs = { workspace = true }
url = { workspace = true }
keyring-core = { workspace = true }
uuid = { version = "1", features = [ "v4" ] }
sqlx = { version = "0.9", features = [ "sqlite", "runtime-tokio", "migrate" ] }
tokio = { version = "1", features = [ "rt", "rt-multi-thread" ] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

# Native stores; same item layout as keyring 3, so existing keys stay readable.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = [ "keychain" ] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

# async-io, not tokio: the tokio flavour panics inside Rocket's runtime.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = [
	"rt-async-io-crypto-rust",
] }
