[package]
name = "aghub-inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Inference provider configuration storage for aghub"

[dependencies]
aghub-json = { path = "../json" }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
log = "0.4.31"
dirs = { workspace = true }
url = { workspace = true }
# Linux: secret-service (pure-Rust zbus/async-io backend), not linux-native
# (keyutils) — same reasoning as `crates/api/Cargo.toml` (non-persistent
# kernel keyring + panics if zbus's tokio backend were picked instead from
# inside a tokio runtime). Keep this feature list identical to `aghub-api`'s.
keyring = { version = "3", features = [
	"apple-native",
	"windows-native",
	"async-secret-service",
	"crypto-rust",
	"async-io",
] }
uuid = { version = "1", features = [ "v4" ] }
sqlx = { version = "0.9", features = [ "sqlite", "runtime-tokio", "migrate" ] }
tokio = { version = "1", features = [ "rt", "rt-multi-thread" ] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
