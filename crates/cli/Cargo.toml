[package]
name = "aghub-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI tool for managing Code Agent configurations"

[[bin]]
name = "aghub-cli"
path = "src/main.rs"

[dependencies]
aghub-core = { path = "../core" }
aghub-agents = { path = "../agents" }
aghub-cc-plugins = { path = "../cc-plugins" }
aghub-git = { path = "../git" }
skill = { path = "../skill" }
skill-update = { path = "../skill-update" }

clap = { workspace = true }
tabled = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tokio = { version = "1", features = [
	"rt",
	"rt-multi-thread",
	"macros",
	"time",
	"sync",
] }
gix = { version = "0.84", default-features = false }
tempfile = { workspace = true }
chrono = { version = "0.4", features = [ "serde" ] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
