[package]
name = "skill-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Skill update-check orchestrator (group, ls-refs preflight, treeless fetch, hash compare)"

[dependencies]
aghub-core = { path = "../core" }
aghub-git = { path = "../git" }
skill = { path = "../skill" }
