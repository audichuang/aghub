[package]
name = "skill-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Skill update-check orchestrator (group, ls-refs preflight, treeless fetch, hash compare)"

[dependencies]
aghub-core = { path = "../core" }
aghub-git = { path = "../git" }
skill = { path = "../skill" }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = [
	"rt",
	"rt-multi-thread",
	"macros",
	"time",
	"sync",
] }
tempfile = { workspace = true }
gix = "0.84"
keyring = { version = "3", features = [
	"apple-native",
	"windows-native",
	"linux-native",
] }
uuid = { version = "1", features = [ "v4" ] }
log = "0.4.31"

[dev-dependencies]
tempfile = { workspace = true }
