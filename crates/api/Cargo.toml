[package]
name = "aghub-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "REST API server for aghub"

[[bin]]
name = "aghub-api"
path = "src/main.rs"

[lib]
name = "aghub_api"
path = "src/lib.rs"
crate-type = [ "rlib" ]

[dependencies]
aghub-core = { path = "../core" }
aghub-git = { path = "../git" }
aghub-inference = { path = "../inference" }
aghub-cc-plugins = { path = "../cc-plugins" }
skill = { path = "../skill" }
skill-update = { path = "../skill-update" }
skills-sh = { path = "../skills-sh" }
# The embedded/localhost API intentionally serves HTTP/1 only; it does not
# need Rocket's optional HTTP/2 stack (and its legacy Hyper 0.14 dependency).
rocket = { version = "0.5", default-features = false, features = [ "json" ] }
rocket_cors = "0.6.0"
tokio = { version = "1", features = [ "rt-multi-thread", "macros", "process", "time", "sync" ] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
ts-rs = { workspace = true }
chrono = { version = "0.4", features = [ "serde" ] }
gix = "0.88"
which = "8"
open = "5"
tempfile = "3"
keyring-core = { workspace = true }
uuid = { version = "1", features = [ "v4" ] }
log = "0.4.31"
reqwest = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
url = { workspace = true }
