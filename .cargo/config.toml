# No rustc-wrapper here: a compiler cache is a per-machine choice, and mbx
# caches nothing when one is configured (docs/history/tooling.md#target-dir-filled-the-disk).
[profile.dev]
# Faster debug builds with minimal optimization
opt-level = 0
# Keep panic backtraces (file:line) but drop the full DWARF a step debugger
# needs — that was ~80% of every test binary. Inherited by [profile.test] and
# by dependencies. Set back to `true` if you need to inspect locals in gdb.
debug = "line-tables-only"

[profile.release]
# Keep default release settings for performance
# Default: opt-level = 3, lto = false, codegen-units = 256

[profile.dev.package."*"]
# Faster compilation for dependencies in dev builds
opt-level = 1
# Dependencies carry no line tables: smaller target/ and CI caches, faster
# links. Workspace crates keep theirs (profile.dev), so our frames still
# print file:line.
debug = false
