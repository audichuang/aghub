# Advisories reachable only through a dependency we cannot upgrade past them.
# Each entry needs a reason and a lift condition:
# docs/history/tooling.md#cargo-audit-ignores-the-updaters-zip-4
# docs/history/tooling.md#cargo-audit-ignores-sqlxs-bundled-sqlite
[advisories]
ignore = [
	# zip 4.x, pulled in only by tauri-plugin-updater (Windows). Every
	# release through 2.14.0 / 3.0.0-alpha pins `zip ^4`. The updater extracts
	# only an archive whose minisign signature `download()` already verified
	# against our pinned pubkey. Lift when the updater moves to zip >= 9.
	"RUSTSEC-2026-0367",
	"RUSTSEC-2026-0368",
	"RUSTSEC-2026-0369",
	# Same zip 4 copy, same reasoning: an extract abort on a crafted symlink
	# size is unreachable behind the signature check.
	"RUSTSEC-2026-0429",
	# Bundled SQLite < 3.54 via sqlx-sqlite 0.9.0 (latest), which caps
	# libsqlite3-sys < 0.38. Exposure needs a db + `-wal` written by a less
	# trusted party; the only database opened is inference's own file under
	# the app data root. Lift when sqlx allows libsqlite3-sys >= 0.39.
	"RUSTSEC-2026-0459",
]
