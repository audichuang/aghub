name: Warm release cache

# Compiles release.yml's dependency graph on main and saves it, so a tag run
# restores it instead of compiling ~600 crates cold. A tag run cannot save a
# cache any later tag can read (caches are scoped to their ref), but every ref
# can read the default branch's caches. Why and what it bought:
# docs/history/tooling.md#release-build-speed
#
# The cargo commands and the job env below MUST match release.yml's
# build-tauri / build-cli: rust-cache hashes RUST*/CARGO* env vars and the
# toolchain into the key, and cargo reuses a dependency only when its feature
# set matches.

on:
    push:
        branches: ["main"]
        paths:
            - "Cargo.lock"
            - "**/Cargo.toml"
            - ".github/workflows/release-cache.yml"
    # A new stable toolchain changes the key without touching any file; the
    # weekly run also keeps these entries from being LRU-evicted between
    # releases, since only restoring an entry refreshes it.
    schedule:
        - cron: "17 3 * * 1"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    warm:
        name: Warm (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            RUSTC_WRAPPER: ""
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
        steps:
            - uses: actions/checkout@v6

            - name: Exclude build dirs from Windows Defender (compile speedup)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
                  exit 0

            - name: Install Linux Dependencies
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Rust Cache
              id: cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: release-${{ matrix.os }}-${{ matrix.target }}

            # An exact hit means this toolchain + lockfile is already warm.
            - name: Setup Bun
              if: steps.cache.outputs.cache-hit != 'true'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
                  no-cache: true

            - name: Build frontend (the desktop crate embeds ../dist)
              if: steps.cache.outputs.cache-hit != 'true'
              run: |
                  cd crates/desktop
                  bun install --frozen-lockfile
                  bun run build

            # Same order and flags as release.yml: the sidecar build, then what
            # `tauri build` runs, then the CLI (and the Linux api asset).
            - name: Build release dependency graph
              if: steps.cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  T="${{ matrix.target }}"
                  cargo build --release --target "$T" -p aghub -p aghub-api \
                      --bin aghub-api --features tauri/custom-protocol
                  cargo build --release --target "$T" -p aghub --bins \
                      --features tauri/custom-protocol
                  cargo build --release -p aghub-cli --target "$T"
                  if [ "$T" = "x86_64-unknown-linux-gnu" ]; then
                      cargo build --release -p aghub-api --target "$T"
                  fi
