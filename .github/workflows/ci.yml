name: CI

# Before a speed change here: docs/history/tooling.md records every measured
# attempt on this workflow, kept and rejected.

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

# Never cancel a main run: release.yml's verify-ci needs a green run per commit.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least-privilege permissions; individual jobs may override
permissions:
    contents: read

env:
    # Cross-platform deterministic environment
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: short
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    TZ: UTC
    # Pinned tool versions (change here, propagates to every job)
    BUN_VERSION: 1.3.14
    # Cache & network knobs. No sccache here: its thousands of GHA entries plus
    # rust-cache overflowed the 10GB repo cache and evicted rust-cache's own
    # entries (docs/history/tooling.md#ci-cache-thrash-and-redundant-steps).
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
    # Path filter: skip unrelated jobs to save CI minutes
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            rust: ${{ steps.filter.outputs.rust }}
            desktop: ${{ steps.filter.outputs.desktop }}
            workflows: ${{ steps.filter.outputs.workflows }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      rust:
                          - 'crates/**'
                          - 'Cargo.toml'
                          - 'Cargo.lock'
                          - '.cargo/**'
                          - 'rustfmt.toml'
                      desktop:
                          - 'crates/desktop/**'
                          - 'package.json'
                          - 'bun.lock'
                      workflows:
                          - '.github/workflows/**'
                      docs:
                          - 'docs/**'
                          - '**/*.md'

    # Lint the workflow files themselves
    actionlint:
        name: Lint Workflows
        needs: changes
        if: needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Download actionlint (pinned)
              shell: bash
              run: |
                  set -e
                  ACTIONLINT_VERSION="1.7.12"
                  curl -sSL -o /tmp/actionlint.tar.gz \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
            - name: Run actionlint
              shell: bash
              run: actionlint -color

    # Format check (rustfmt + oxfmt) over the whole repo, on every change.
    format:
        name: Format Check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install root deps (frozen)
              run: bun install --frozen-lockfile
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Rust format
              run: cargo fmt --all -- --check
            - name: Frontend + docs format (whole repo)
              run: bun run format:check
            - name: docs/history links
              run: node scripts/check-history-links.mjs
            - name: No literal tab inside a string (missing `\` continuation)
              run: bash scripts/check-string-tabs.sh

    # Rust lint (clippy + audit) - 3 OS matrix
    lint-rust:
        name: Rust Lint (${{ matrix.os }})
        needs: changes
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config (cross-platform line endings)
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
                  git config --global protocol.version 2
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Install just + cargo-audit
              uses: taiki-e/install-action@v2
              with:
                  tool: just,cargo-audit
            - name: Rust Cache
              id: cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-lint
                  # Save only from main: a PR-scoped cache is invisible to every
                  # other ref and only crowds the 10GB quota. No cache-on-failure:
                  # a run that fails before compiling saves an EMPTY target, and
                  # rust-cache never overwrites an exact key hit, so that empty
                  # cache would stick until Cargo.lock changes.
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            # A key miss restores the closest older entry, and rust-cache saves
            # all of target/ without dropping superseded versions of a crate:
            # every Cargo.lock or profile change carried the old artifacts into
            # the new entry (test 1.2 -> 1.8GB). Main starts clean instead; PRs
            # keep the partial restore. docs/history/tooling.md#ci-cache-bloat
            # rust-cache prunes the crates.io index it saves, so every job
            # re-downloaded it (44-48s on Windows). Restored after rust-cache so
            # the full copy wins. docs/history/tooling.md#ci-apt-tail-and-cargo-index
            - name: Cargo index cache
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/registry/index
                  key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-index-${{ runner.os }}-
            - name: Drop a partially restored target (main only)
              if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
              shell: bash
              run: rm -rf target
            - name: Install Linux system dependencies (GTK/webkit for Tauri)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: scripts/ci-apt-install.sh libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - name: Cargo audit (vulnerabilities fail the job)
              if: matrix.os == 'ubuntu-latest'
              run: cargo audit
            - name: Cargo clippy (warnings as errors, all targets)
              run: cargo clippy --workspace --all-targets --locked -- -D warnings

    # Frontend lint (oxlint: type-aware + type-check, warnings as errors) + the frontend unit tests
    lint-frontend:
        name: Frontend Lint
        needs: changes
        # ALWAYS run on push to main, for the same reason the `test` job does:
        # this is the ONLY job that runs the frontend unit tests, and
        # release.yml's verify-ci only checks the RUN's conclusion — a skipped
        # job leaves that conclusion `success`, so a tag on a commit whose
        # frontend gate never ran would be accepted (skipped != passed). PRs
        # keep the path filter (cheap).
        if: |
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install root deps (frozen)
              run: bun install --frozen-lockfile
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Oxlint check (warnings as errors)
              run: cd crates/desktop && bun run lint:check -- --max-warnings 0
            - name: Type check (TypeScript)
              run: cd crates/desktop && bun run typecheck
            - name: Setup Node (node:test runner for src/lib unit tests)
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Frontend unit tests
              run: cd crates/desktop && bun run test

    # Tests (unit + integration + doc) - 3 OS matrix
    test:
        name: Test (${{ matrix.os }})
        needs: changes
        # ALWAYS run on push to main (github.event_name == 'push' — ci.yml's
        # push trigger is branches:[main]). release.yml's verify-ci gate trusts
        # a green push-to-main CI run as proof the tagged commit was tested on
        # all 3 platforms, so `test` must not be path-skipped for a main commit:
        # a docs-only commit that skipped tests would otherwise be a green run
        # that verify-ci wrongly accepts. PRs keep the path filter (cheap).
        if: |
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.rust == 'true' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
                  git config --global protocol.version 2
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Install just + cargo-nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: just,cargo-nextest
            - name: Rust Cache
              id: cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-test
                  # Save only from main: a PR-scoped cache is invisible to every
                  # other ref and only crowds the 10GB quota. No cache-on-failure:
                  # a run that fails before compiling saves an EMPTY target, and
                  # rust-cache never overwrites an exact key hit, so that empty
                  # cache would stick until Cargo.lock changes.
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            # A key miss restores the closest older entry, and rust-cache saves
            # all of target/ without dropping superseded versions of a crate:
            # every Cargo.lock or profile change carried the old artifacts into
            # the new entry (test 1.2 -> 1.8GB). Main starts clean instead; PRs
            # keep the partial restore. docs/history/tooling.md#ci-cache-bloat
            # rust-cache prunes the crates.io index it saves, so every job
            # re-downloaded it (44-48s on Windows). Restored after rust-cache so
            # the full copy wins. docs/history/tooling.md#ci-apt-tail-and-cargo-index
            - name: Cargo index cache
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/registry/index
                  key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-index-${{ runner.os }}-
            - name: Drop a partially restored target (main only)
              if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
              shell: bash
              run: rm -rf target
            - name: Install Linux system dependencies (GTK/webkit for Tauri)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              # gnome-keyring + dbus-x11: the native keyring smoke test.
              run: scripts/ci-apt-install.sh libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnome-keyring dbus-x11
            # Defender scanned every file the tests create (temp dirs, SQLite
            # journals): aghub-inference's tests ran ~60x slower on Windows
            # than elsewhere. Non-fatal, like release.yml's exclusions.
            # docs/history/tooling.md#windows-test-speed
            - name: Exclude test and build dirs from Windows Defender
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath $env:TEMP
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  exit 0
            - name: Cargo fetch (lockfile must be in sync)
              run: cargo fetch --locked
            - name: Unit + integration tests
              run: just test
            - name: Doc tests
              run: cargo test --workspace --doc
            # The only test against the REAL OS keyring; everything else mocks it.
            - name: Native keyring smoke test
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = "Linux" ]; then
                      # shellcheck disable=SC2016
                      dbus-run-session -- bash -c '
                        eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
                        cargo test --workspace --test keyring_smoke -- --ignored
                      '
                  else
                      cargo test --workspace --test keyring_smoke -- --ignored
                  fi
            # Real-network REST E2E: authenticated GitHub API via the runner's
            # ephemeral GITHUB_TOKEN (no PAT to manage). The test self-skips
            # without a token, so it ONLY exercises the authenticated path here.
            # One platform is enough for a network contract; ubuntu is cheapest.
            # NOT on push-to-main: release.yml's verify-ci gate trusts the green
            # push-to-main run, and this test depends on a third-party repo
            # (vercel-labs/skills) + live GitHub API — an upstream deletion or
            # API outage must not block a release. PRs and manual dispatch
            # still hard-fail on it, which is where regressions get caught.
            # --workspace (not -p): keeps feature unification identical to the
            # `just test` step above, so this reuses that step's already-built
            # test binary instead of recompiling the gix stack under a
            # different feature fingerprint.
            - name: Network E2E (GitHub REST, token-gated)
              if: matrix.os == 'ubuntu-latest' && github.event_name != 'push'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: cargo test --workspace --test skill_repository -- --ignored real_github_rest

    # Release build + smoke test - the 3 release targets. Runs release.yml's
    # exact cargo commands, so main proves the tag would build, and there it
    # saves the dependency cache release.yml restores (a tag run cannot save
    # one a later tag can read). The matrix strings, the cargo commands and
    # the CARGO*/RUST* env (hashed into the key) MUST match release.yml's
    # build-tauri / build-cli. docs/history/tooling.md#release-build-speed
    build:
        name: Build (${{ matrix.target }}, ${{ matrix.part }})
        needs: changes
        # ALWAYS on push to main: PRs build Linux only, so main is the only
        # place Windows/macOS release builds run, and verify-ci trusts any
        # green main run. A path-filtered docs-only successor of a commit whose
        # Windows build failed would be a green run on broken code. It also
        # keeps the release caches current across stable rustc bumps.
        if: |
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.rust == 'true' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            # PRs build Linux only: custom-protocol and the embedded dist are
            # the same on every OS, and Test/Clippy already compile the desktop
            # crate on Windows and macOS. Main builds all three before any tag
            # (verify-ci needs that run green) and saves their caches. Cut the
            # PR critical path from Build Windows (~8.5 min) to ~5. On a PR the
            # Linux build is also split in two parallel legs, `app` (sidecar +
            # desktop) and `bins` (standalone CLI + api); they restore the same
            # cache and save nothing. Main runs `all` so one job saves it.
            # docs/history/tooling.md#pr-builds-linux-only
            matrix:
                include: ${{ fromJSON(github.event_name == 'pull_request'
                    && '[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","part":"app"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","part":"bins"}]'
                    || '[{"os":"macos-latest","target":"aarch64-apple-darwin","part":"all"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","part":"all"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","part":"all"}]') }}
        steps:
            - uses: actions/checkout@v6
            - name: Install Linux system dependencies (GTK/webkit for Tauri)
              if: matrix.os == 'ubuntu-22.04'
              run: scripts/ci-apt-install.sh libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            # tauri-cli exports MACOSX_DEPLOYMENT_TARGET (the bundle's minimum
            # macOS, default 10.13) and cc-rs reads it, so without the same value
            # here every C-backed crate (aws-lc-sys, ring, zstd-sys…) rebuilt in
            # release.yml's Build Tauri. rust-cache does not hash it, so the key is unchanged.
            - name: Match tauri's macOS deployment target
              if: runner.os == 'macOS'
              run: echo "MACOSX_DEPLOYMENT_TARGET=10.13" >> "$GITHUB_ENV"
            - name: Rust Cache
              id: cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: release-${{ matrix.os }}-${{ matrix.target }}
                  # Save only from main, see lint-rust.
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            # A key miss restores the closest older entry, and rust-cache saves
            # all of target/ without dropping superseded versions of a crate:
            # every Cargo.lock or profile change carried the old artifacts into
            # the new entry (test 1.2 -> 1.8GB). Main starts clean instead; PRs
            # keep the partial restore. docs/history/tooling.md#ci-cache-bloat
            # rust-cache prunes the crates.io index it saves, so every job
            # re-downloaded it (44-48s on Windows). Restored after rust-cache so
            # the full copy wins. docs/history/tooling.md#ci-apt-tail-and-cargo-index
            - name: Cargo index cache
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/registry/index
                  key: cargo-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-index-${{ runner.os }}-
            - name: Drop a partially restored target (main only)
              if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
              shell: bash
              run: rm -rf target
            - name: Setup Bun
              if: matrix.part != 'bins'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            # The desktop crate embeds ../dist, so every OS builds it.
            - name: Build frontend (typecheck + Vite)
              if: matrix.part != 'bins'
              run: |
                  cd crates/desktop
                  bun install --frozen-lockfile
                  bun run build
            # The sidecar build, what `tauri build` runs, the CLI, and the
            # Linux aghub-api asset — in release.yml's order.
            - name: Build release binaries
              shell: bash
              run: |
                  set -euo pipefail
                  T="${{ matrix.target }}"
                  P="${{ matrix.part }}"
                  if [ "$P" != bins ]; then
                      cargo build --release --target "$T" -p aghub -p aghub-api \
                          --bin aghub-api --features tauri/custom-protocol
                      cargo build --release --target "$T" -p aghub --bins \
                          --features tauri/custom-protocol
                  fi
                  if [ "$P" != app ]; then
                      cargo build --release -p aghub-cli --target "$T"
                      if [ "$T" = "x86_64-unknown-linux-gnu" ]; then
                          cargo build --release -p aghub-api --target "$T"
                      fi
                  fi
            - name: Smoke test CLI binary
              if: matrix.part != 'app'
              shell: bash
              run: |
                  BIN="target/${{ matrix.target }}/release/aghub-cli"
                  "$BIN" --version
                  "$BIN" --help > /dev/null

    # Repo cache is 10GB. A Cargo.lock or toolchain change saves a new key per
    # job and leaves the old one until LRU eviction, which then picks live
    # entries too; tag-scoped caches are readable by no later run (their ref reads
    # "refs/heads/refs/tags/…", hence `contains`). Main only.
    prune-caches:
        name: Prune stale caches
        needs: [lint-rust, test, build]
        if: always() && github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Delete superseded rust-cache keys and tag-scoped caches
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  # rust-cache keys end in -<env hash>-<lockfile hash>; the env
                  # hash carries the rustc version, so group on what precedes
                  # both and keep the newest entry of each group. cargo-index-* keys
                  # end in the Cargo.lock hash: keep main's newest, drop PR copies.
                  gh cache list -R "$REPO" -L 500 --json id,key,ref,createdAt --jq '
                    [.[] | select(.ref | contains("refs/tags/"))]
                    + ([.[] | select(.ref == "refs/heads/main" and (.key | startswith("v0-rust-")))]
                       | group_by(.key | sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; ""))
                       | map(sort_by(.createdAt) | .[:-1]) | add // [])
                    + [.[] | select((.key | startswith("cargo-index-")) and .ref != "refs/heads/main")]
                    + ([.[] | select(.ref == "refs/heads/main" and (.key | startswith("cargo-index-")))]
                       | group_by(.key | sub("-[0-9a-f]{64}$"; ""))
                       | map(sort_by(.createdAt) | .[:-1]) | add // [])
                    | unique_by(.id) | .[] | "\(.id)\t\(.ref)\t\(.key)"' > stale.tsv
                  cat stale.tsv
                  cut -f1 stale.tsv | xargs -r -n1 gh cache delete -R "$REPO"
