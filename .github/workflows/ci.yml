name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Default to least-privilege permissions; individual jobs may override
permissions:
    contents: read

env:
    # Cross-platform deterministic environment
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: short
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    TZ: UTC
    # Pinned tool versions (change here, propagates to every job)
    BUN_VERSION: 1.3.14
    # Cache & network knobs
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    # Path filter: skip unrelated jobs to save CI minutes
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        outputs:
            rust: ${{ steps.filter.outputs.rust }}
            desktop: ${{ steps.filter.outputs.desktop }}
            workflows: ${{ steps.filter.outputs.workflows }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      rust:
                          - 'crates/**'
                          - 'Cargo.toml'
                          - 'Cargo.lock'
                          - '.cargo/**'
                          - 'rustfmt.toml'
                      desktop:
                          - 'crates/desktop/**'
                          - 'package.json'
                          - 'bun.lock'
                      workflows:
                          - '.github/workflows/**'
                      docs:
                          - 'docs/**'
                          - '**/*.md'

    # Lint the workflow files themselves
    actionlint:
        name: Lint Workflows
        needs: changes
        if: needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Download actionlint (pinned)
              shell: bash
              run: |
                  set -e
                  ACTIONLINT_VERSION="1.7.12"
                  curl -sSL -o /tmp/actionlint.tar.gz \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
            - name: Run actionlint
              shell: bash
              run: actionlint -color

    # Format check (rustfmt + prettier)
    format:
        name: Format Check
        needs: changes
        if: |
            needs.changes.outputs.rust == 'true' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.docs == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install root deps (frozen)
              run: bun install --frozen-lockfile
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Rust format
              run: cargo fmt --all -- --check
            - name: Frontend format
              run: cd crates/desktop && bun run format:check

    # Rust lint (clippy + audit) - 3 OS matrix
    lint-rust:
        name: Rust Lint (${{ matrix.os }})
        needs: changes
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config (cross-platform line endings)
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
                  git config --global protocol.version 2
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install just + cargo-audit
              uses: taiki-e/install-action@v2
              with:
                  tool: just,cargo-audit
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-lint
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - name: Install root deps (frozen)
              run: bun install --frozen-lockfile
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Cargo audit (advisories; non-blocking until tree is clean)
              continue-on-error: true
              run: cargo audit
            - name: Cargo clippy (warnings as errors, all targets)
              run: cargo clippy --workspace --all-targets -- -D warnings

    # Frontend lint (ESLint, warnings as errors)
    lint-frontend:
        name: Frontend Lint
        needs: changes
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install root deps (frozen)
              run: bun install --frozen-lockfile
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: ESLint check (warnings as errors)
              run: cd crates/desktop && bun run lint:check -- --max-warnings 0
            - name: Setup Node (node:test runner for src/lib unit tests)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Frontend unit tests
              run: cd crates/desktop && bun run test

    # Tests (unit + integration + doc) - 3 OS matrix
    test:
        name: Test (${{ matrix.os }})
        needs: changes
        # ALWAYS run on push to main (github.event_name == 'push' — ci.yml's
        # push trigger is branches:[main]). release.yml's verify-ci gate trusts
        # a green push-to-main CI run as proof the tagged commit was tested on
        # all 3 platforms, so `test` must not be path-skipped for a main commit:
        # a docs-only commit that skipped tests would otherwise be a green run
        # that verify-ci wrongly accepts. PRs keep the path filter (cheap).
        if: |
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.rust == 'true' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - name: Normalize git config
              run: |
                  git config --global core.autocrlf false
                  git config --global core.eol lf
                  git config --global core.longpaths true
                  git config --global protocol.version 2
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install just
              uses: taiki-e/install-action@v2
              with:
                  tool: just
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-test
                  cache-on-failure: true
            - name: Install Linux system dependencies (GTK/webkit for Tauri)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                  sudo apt-get update
                  # gnome-keyring + dbus-x11 (for `dbus-run-session`) are for
                  # the real Secret Service smoke test step below, not the
                  # main test suite (GitHub #15 P1-4) — see that step's comment.
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnome-keyring dbus-x11
            - name: Cargo fetch
              run: cargo fetch
            - name: Install root deps (frozen)
              run: bun install --frozen-lockfile
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Type check (TypeScript)
              run: cd crates/desktop && bun run typecheck
            - name: Unit + integration tests
              run: just test
            - name: Doc tests
              run: cargo test --workspace --doc
            # Real Secret Service smoke test (GitHub #15 P1-4): every OTHER
            # keyring-touching test in the workspace mocks/injects the
            # credential store on purpose (deterministic, no real backend
            # needed — see GitHub #15 P1-1). This is the ONE test that drives
            # the REAL `NativeCredentialStore` end-to-end, so it needs an
            # actual Secret Service session, which `ubuntu-latest` does not
            # have by default. `dbus-run-session` gives it a throwaway D-Bus
            # session bus; `gnome-keyring-daemon --unlock` (fed an empty
            # password over stdin, since there's no pre-existing keyring on a
            # fresh runner) starts+registers `org.freedesktop.secrets` on
            # that bus. Deliberately scoped to ONLY this one test binary —
            # the main `just test` step above must keep running its
            # deterministic, keyring-free path unchanged.
            - name: Real Secret Service smoke test (keyring, ubuntu only)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                  dbus-run-session -- bash -c '
                    eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
                    cargo test -p aghub-inference --test keyring_smoke -- --ignored
                  '
            # Real-network REST E2E: authenticated GitHub API via the runner's
            # ephemeral GITHUB_TOKEN (no PAT to manage). The test self-skips
            # without a token, so it ONLY exercises the authenticated path here.
            # One platform is enough for a network contract; ubuntu is cheapest.
            # NOT on push-to-main: release.yml's verify-ci gate trusts the green
            # push-to-main run, and this test depends on a third-party repo
            # (vercel-labs/skills) + live GitHub API — an upstream deletion or
            # API outage must not block a release. PRs and manual dispatch
            # still hard-fail on it, which is where regressions get caught.
            # --workspace (not -p): keeps feature unification identical to the
            # `just test` step above, so this reuses that step's already-built
            # test binary instead of recompiling the gix stack under a
            # different feature fingerprint.
            - name: Network E2E (GitHub REST, token-gated)
              if: matrix.os == 'ubuntu-latest' && github.event_name != 'push'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: cargo test --workspace --test skill_repository -- --ignored real_github_rest
            - name: Agent-validation tests (best-effort, may need real CLIs)
              continue-on-error: true
              run: just test-with-validation

    # Build + smoke test - 3 OS matrix
    build:
        name: Build (${{ matrix.os }})
        needs: changes
        if: |
            needs.changes.outputs.rust == 'true' ||
            needs.changes.outputs.desktop == 'true' ||
            needs.changes.outputs.workflows == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install just
              uses: taiki-e/install-action@v2
              with:
                  tool: just
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ runner.os }}-build
                  cache-on-failure: true
            - name: Install root deps (frozen)
              run: bun install --frozen-lockfile
            - name: Install desktop deps (frozen)
              run: cd crates/desktop && bun install --frozen-lockfile
            - name: Build CLI (release)
              run: just build
            - name: Smoke test CLI binary (verifies cross-platform build works)
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = "Windows" ]; then
                      ./target/release/aghub-cli.exe --version
                      ./target/release/aghub-cli.exe --help > /dev/null
                  else
                      ./target/release/aghub-cli --version
                      ./target/release/aghub-cli --help > /dev/null
                  fi
            - name: Build frontend (typecheck + Vite)
              run: cd crates/desktop && bun run build
