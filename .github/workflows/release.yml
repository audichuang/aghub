name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version tag (e.g., v1.0.0)"
                required: true
                type: string
            prerelease:
                description: "Create as pre-release"
                required: false
                type: boolean
                default: true

# Serialize runs for the same tag so a re-pushed tag never builds/publishes
# concurrently with an earlier run. cancel-in-progress is intentionally FALSE:
# cancelling a release mid-build/publish would leave a half-populated GitHub
# Release (partial assets / latest.json). To redo a tag, cancel the old run
# manually (gh run cancel) per the releasing-aghub runbook, then re-tag.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # Release gate: the tagged commit must already be GREEN on ci.yml from its
    # push to main. ci.yml's `test` job runs UNCONDITIONALLY on every push to
    # main (see its `if:` github.event_name == 'push'), so the full suite
    # (typecheck + `just test` + doc tests) ran on the SAME 3-OS matrix for that
    # commit. Re-running it at release time (~26 min, Windows-bound, on the
    # critical path) produced zero new signal — pure duplication. Assert the
    # existing result instead of recomputing it.
    #
    # Soundness: count ONLY event=="push" success runs. A push to main always
    # runs `test`, so a green push run proves the commit was tested on all 3
    # platforms. pull_request runs are deliberately NOT trusted — they keep
    # ci.yml's path filters, so a docs-only PR can be green with `test` SKIPPED,
    # and trusting it would let an untested commit ship (skipped != passed).
    # A commit with no green push run is refused — which also does what the old
    # re-test gate could not: block a tag on a commit that never landed on main.
    verify-ci:
        name: Verify CI is green for this commit
        runs-on: ubuntu-latest
        permissions:
            actions: read
        steps:
            - name: Assert ci.yml passed for the tagged commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ github.sha }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  N=$(gh api \
                    "/repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&event=push" \
                    --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
                  if [ "$N" -lt 1 ]; then
                      echo "::error::No green push-to-main ci.yml run for $SHA." >&2
                      echo "Release only commits that landed on main and passed CI (see releasing-aghub)." >&2
                      echo "Push the commit to main, wait for CI to pass, then push the tag." >&2
                      exit 1
                  fi
                  echo "ci.yml is green (push to main) for $SHA ($N run(s)) — release cleared."

    changelog:
        name: Generate Changelog
        needs: verify-ci
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Generate Changelog
              uses: orhun/git-cliff-action@v4
              id: git-cliff
              with:
                  config: cliff.toml
                  args: -vv --latest --strip header
              env:
                  OUTPUT: CHANGES.md
                  GITHUB_REPO: ${{ github.repository }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.version || github.ref_name }}
                  name: "aghub ${{ github.event.inputs.version || github.ref_name }}"
                  body_path: CHANGES.md
                  draft: false
                  prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.ref_name, '-') }}

    build-tauri:
        needs: [verify-ci, changelog]
        name: Build Desktop (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: macos-latest
                      target: x86_64-apple-darwin
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

        steps:
            - uses: actions/checkout@v6

            - name: Exclude build dirs from Windows Defender (compile speedup)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  # Real-time AV scanning of every artifact a Rust/Tauri build
                  # writes is a Windows-only tax on the slowest leg of the
                  # release. Exclude the build + toolchain dirs. Non-fatal by
                  # design: a runner with Defender disabled or tamper-protected
                  # just skips it — this never fails or alters the build output.
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
                  exit 0

            - name: Install Linux Dependencies
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Cargo Fetch
              run: cargo fetch

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  # Pinned for reproducibility — keep in sync with ci.yml
                  bun-version: 1.3.14

            - name: Install frontend dependencies (frozen)
              run: |
                  cd crates/desktop
                  bun install --frozen-lockfile

            - name: Sync Version
              shell: bash
              env:
                  VERSION: ${{ github.event.inputs.version || github.ref_name }}
              run: |
                  VERSION="${VERSION#v}"
                  echo "Syncing version across files: $VERSION"
                  case "${{ matrix.os }}" in
                    macos*)
                      sed -i '' "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
                      sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" crates/desktop/package.json
                      sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" crates/desktop/src-tauri/tauri.conf.json
                      ;;
                    *)
                      sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
                      sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" crates/desktop/package.json
                      sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" crates/desktop/src-tauri/tauri.conf.json
                      ;;
                  esac
                  # sed exits 0 even on no-match, so prove the sync actually took.
                  # package.json has NO "version" field, so do NOT assert it; its
                  # sed is a harmless no-op left in place.
                  grep -q "^version = \"$VERSION\"$" Cargo.toml \
                    || { echo "Cargo.toml version not synced to $VERSION" >&2; exit 1; }
                  grep -q "\"version\": \"$VERSION\"" crates/desktop/src-tauri/tauri.conf.json \
                    || { echo "tauri.conf.json version not synced to $VERSION" >&2; exit 1; }
                  echo "Version sync asserted: $VERSION"

            - name: Stage version-locked aghub-api (per target)
              shell: bash
              env:
                  VERSION: ${{ github.event.inputs.version || github.ref_name }}
              run: |
                  set -euo pipefail
                  VERSION="${VERSION#v}"
                  TARGET="${{ matrix.target }}"
                  BIN="aghub-api"
                  if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
                      BIN="aghub-api.exe"
                  fi
                  STAGE="crates/desktop/src-tauri/binaries"
                  rm -rf "$STAGE"
                  mkdir -p "$STAGE"
                  # Explicit version for build.rs — without it the version-sync
                  # sed dirties the tree and `git describe --dirty=-dev` stamps
                  # the embedded api "X.Y.Z-dev" (see build-cli's Build CLI step).
                  # Persisted to GITHUB_ENV (not just exported here) so the
                  # SAME pin also covers "Build Tauri" below: tauri-action
                  # relinks the aghub-api rlib into the desktop, and without
                  # this the env going set->unset between steps reruns
                  # crates/api/build.rs and re-stamps it "X.Y.Z-dev".
                  export AGHUB_RELEASE_VERSION="$VERSION"
                  echo "AGHUB_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
                  # Built AFTER Sync Version, so it is version-locked to the tag.
                  cargo build -p aghub-api --release --target "$TARGET"
                  cp "target/$TARGET/release/$BIN" "$STAGE/$BIN"
                  test -f "$STAGE/$BIN" \
                    || { echo "sidecar not staged at $STAGE/$BIN" >&2; exit 1; }

                  # Host-arch-aware smoke. Both aarch64-apple-darwin and
                  # x86_64-apple-darwin build on the same arm64 macos-latest
                  # runner; running the x86_64 binary relies on Rosetta, which is
                  # NOT guaranteed. Only EXECUTE the binary when its target arch
                  # matches the runner host arch; otherwise verify via the synced
                  # Cargo.toml version string + file existence (never execute).
                  HOST_ARCH="$(uname -m)"   # arm64 / aarch64 / x86_64
                  case "$TARGET" in
                    aarch64-*) TGT_ARCH="arm64" ;;
                    x86_64-*)  TGT_ARCH="x86_64" ;;
                    *)         TGT_ARCH="unknown" ;;
                  esac
                  norm() { case "$1" in aarch64) echo arm64 ;; *) echo "$1" ;; esac; }
                  if [ "$(norm "$HOST_ARCH")" = "$(norm "$TGT_ARCH")" ]; then
                      echo "Native target ($TARGET on $HOST_ARCH): executing --version"
                      OUT="$("$STAGE/$BIN" --version)"
                      echo "sidecar reports: $OUT"
                      WANT_MM="$(printf '%s\n' "$VERSION" | cut -d. -f1-2)"
                      GOT_MM="$(printf '%s\n' "$OUT" | sed -n 's/^aghub-api \([0-9]*\.[0-9]*\).*/\1/p')"
                      if [ -z "$GOT_MM" ] || [ "$GOT_MM" != "$WANT_MM" ]; then
                          echo "sidecar version $GOT_MM != synced $WANT_MM" >&2
                          exit 1
                      fi
                  else
                      echo "Non-native target ($TARGET on $HOST_ARCH): file+version-string check, not executing"
                      grep -q "^version = \"$VERSION\"$" Cargo.toml \
                        || { echo "Cargo.toml not at $VERSION for non-native smoke" >&2; exit 1; }
                  fi

            - name: Build Tauri
              # TODO: pin to a specific tauri-action release for supply-chain integrity
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Apple code-signing: leave commented while no Apple Developer certs exist.
                  # Passing these as empty strings makes Tauri attempt `security import` on an
                  # empty cert and fail the macOS build. Uncomment + set the secrets once you
                  # have an Apple Developer account to ship signed/notarized dmgs.
                  # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  # APPLE_ID: ${{ secrets.APPLE_ID }}
                  # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ github.event.inputs.version || github.ref_name }}
                  releaseName: "aghub ${{ github.event.inputs.version || github.ref_name }}"
                  releaseDraft: false
                  prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.ref_name, '-') }}
                  # Windows MSI (WiX) rejects a non-numeric pre-release identifier
                  # (e.g. -rc.1): "pre-release identifier ... must be numeric-only".
                  # NSIS handles it fine, so for pre-release tags build NSIS only on
                  # Windows (keeps setup.exe + the updater artifact; stable tags still
                  # get the MSI). Other platforms/stable use the configured targets.
                  # Both arms pass the bundle overlay so the staged aghub-api
                  # sidecar ships inside the desktop bundle (see "Stage
                  # version-locked aghub-api" above).
                  args: ${{ (matrix.target == 'x86_64-pc-windows-msvc' && contains(github.ref_name, '-')) && format('--target {0} --bundles nsis --config src-tauri/tauri.bundle.conf.json', matrix.target) || format('--target {0} --config src-tauri/tauri.bundle.conf.json', matrix.target) }}
                  includeUpdaterJson: true
                  projectPath: crates/desktop

            - name: Prepare Generic Artifact
              shell: bash
              run: |
                  if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
                      find target -type f -name "*setup.exe" -exec cp {} aghub-windows-setup.exe \;
                      echo "GENERIC_ASSET=aghub-windows-setup.exe" >> "$GITHUB_ENV"
                  elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
                      find target -type f -name "*.AppImage" -exec cp {} aghub-linux.AppImage \;
                      echo "GENERIC_ASSET=aghub-linux.AppImage" >> "$GITHUB_ENV"
                  elif [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
                      find target -type f -name "*.dmg" -exec cp {} aghub_mac_intel.dmg \;
                      echo "GENERIC_ASSET=aghub_mac_intel.dmg" >> "$GITHUB_ENV"
                  elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
                      find target -type f -name "*.dmg" -exec cp {} aghub_mac_arm.dmg \;
                      echo "GENERIC_ASSET=aghub_mac_arm.dmg" >> "$GITHUB_ENV"
                  fi

            - name: Upload Generic Release Asset
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.version || github.ref_name }}
                  files: ${{ env.GENERIC_ASSET }}

    build-cli:
        needs: verify-ci
        name: Build CLI (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: macos-latest
                      target: x86_64-apple-darwin
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

        steps:
            - uses: actions/checkout@v6

            - name: Exclude build dirs from Windows Defender (compile speedup)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  # See build-tauri: real-time AV scanning taxes Windows Rust
                  # builds. Non-fatal — never fails or alters the build output.
                  $ErrorActionPreference = 'SilentlyContinue'
                  Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
                  Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
                  exit 0

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Cargo Fetch
              run: cargo fetch

            - name: Sync Version
              shell: bash
              env:
                  VERSION: ${{ github.event.inputs.version || github.ref_name }}
              run: |
                  VERSION="${VERSION#v}"
                  case "${{ matrix.os }}" in
                    macos*)
                      sed -i '' "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
                      ;;
                    *)
                      sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
                      ;;
                  esac

            - name: Build CLI
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
              run: |
                  # Explicit version for build.rs — without it the version-sync
                  # sed dirties the tree and `git describe --dirty=-dev` stamps
                  # the release binary "X.Y.Z-dev".
                  export AGHUB_RELEASE_VERSION="${RELEASE_TAG#v}"
                  cargo build --release -p aghub-cli --target ${{ matrix.target }}

            - name: Smoke test CLI (verifies the released binary works)
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
              run: |
                  BIN="target/${{ matrix.target }}/release/aghub-cli"
                  if [ "${{ matrix.os }}" = "windows-latest" ]; then
                      BIN="${BIN}.exe"
                  fi
                  "$BIN" --version
                  "$BIN" --help > /dev/null
                  # A binary that self-reports the wrong version (e.g. the old
                  # "-dev" suffix from a sed-dirtied tree) must not ship.
                  if [[ "$RELEASE_TAG" =~ ^v[0-9] ]]; then
                      GOT="$("$BIN" --version)"
                      [[ "$GOT" == "aghub-cli ${RELEASE_TAG#v}" ]] \
                        || { echo "version mismatch: got '$GOT', want 'aghub-cli ${RELEASE_TAG#v}'" >&2; exit 1; }
                  fi

            - name: Package CLI (Unix)
              if: matrix.os != 'windows-latest'
              run: |
                  tar -czvf aghub-cli-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release aghub-cli

            - name: Package CLI (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  Compress-Archive -Path target/${{ matrix.target }}/release/aghub-cli.exe -DestinationPath aghub-cli-${{ matrix.target }}.zip

            # Linux-only: publish an `aghub-api` release asset so a remote VM
            # (Mac desktop -> Linux VM over SSH) can be provisioned/upgraded
            # from a release instead of requiring a from-source cargo build.
            # Other 3 legs are untouched — the desktop bundles its own
            # platform's aghub-api sidecar (see build-tauri) and never needs
            # a standalone macOS/Windows api archive.
            - name: Build aghub-api (Linux release asset)
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
              run: |
                  # Same rationale as the CLI build above: pin the version
                  # explicitly so a sed-dirtied tree can't stamp "-dev".
                  export AGHUB_RELEASE_VERSION="${RELEASE_TAG#v}"
                  cargo build --release -p aghub-api --target ${{ matrix.target }}

            - name: Smoke test aghub-api (verifies the released binary works)
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
              run: |
                  BIN="target/${{ matrix.target }}/release/aghub-api"
                  "$BIN" --version
                  if [[ "$RELEASE_TAG" =~ ^v[0-9] ]]; then
                      GOT="$("$BIN" --version)"
                      [[ "$GOT" == "aghub-api ${RELEASE_TAG#v}" ]] \
                        || { echo "version mismatch: got '$GOT', want 'aghub-api ${RELEASE_TAG#v}'" >&2; exit 1; }
                  fi

            - name: Package aghub-api (Linux release asset)
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              run: |
                  tar -czvf aghub-api-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release aghub-api

            - name: Upload CLI to Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.version || github.ref_name }}
                  prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.ref_name, '-') }}
                  files: |
                      aghub-cli-*
                      aghub-api-*

    publish-homebrew:
        name: Update Homebrew Tap
        needs: [build-tauri, build-cli]
        # Skip the stable Homebrew bump for pre-releases (tags with a '-' suffix,
        # e.g. vX.Y.Z-rc.N). RC testers download the prerelease assets directly;
        # `brew install aghub` must keep pointing at the last STABLE version.
        if: ${{ !contains(github.event.inputs.version || github.ref_name, '-') }}
        runs-on: ubuntu-latest
        env:
            RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        steps:
            - name: Validate release tag
              shell: bash
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Invalid release tag: $RELEASE_TAG" >&2
                      exit 1
                  fi

            - name: Checkout Homebrew Tap
              uses: actions/checkout@v6
              with:
                  repository: "audichuang/homebrew-tap"
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: tap

            - name: Update Formula and Cask
              env:
                  VERSION: ${{ env.RELEASE_TAG }}
              run: |
                  VERSION="${VERSION#v}"
                  echo "Updating for version: ${VERSION}"

                  # Download CLI assets to compute checksums
                  echo "Downloading CLI assets..."
                  wget -q "https://github.com/audichuang/aghub/releases/download/v${VERSION}/aghub-cli-x86_64-apple-darwin.tar.gz" -O aghub-cli_mac_intel.tar.gz || echo "Failed to download x86_64 CLI"
                  wget -q "https://github.com/audichuang/aghub/releases/download/v${VERSION}/aghub-cli-aarch64-apple-darwin.tar.gz" -O aghub-cli_mac_arm.tar.gz || echo "Failed to download aarch64 CLI"
                  wget -q "https://github.com/audichuang/aghub/releases/download/v${VERSION}/aghub-cli-x86_64-unknown-linux-gnu.tar.gz" -O aghub-cli_linux.tar.gz || echo "Failed to download linux CLI"

                  AGENT_MAC_INTEL_SHA=$(sha256sum aghub-cli_mac_intel.tar.gz | awk '{print $1}')
                  AGENT_MAC_ARM_SHA=$(sha256sum aghub-cli_mac_arm.tar.gz | awk '{print $1}')
                  AGENT_LINUX_SHA=$(sha256sum aghub-cli_linux.tar.gz | awk '{print $1}')

                  # Formula MUST live in Formula/ — modern Homebrew ignores
                  # formulae at the tap root (installs silently resolve to the
                  # keg's cached copy and never see updates).
                  mkdir -p tap/Formula
                  cat << INNEREOF > tap/Formula/aghub-cli.rb
                  class AghubCli < Formula
                    desc "AI coding agent configuration management tool (CLI)"
                    homepage "https://github.com/audichuang/aghub"
                    version "${VERSION}"
                    license "MIT"

                    on_macos do
                      if Hardware::CPU.arm?
                        url "https://github.com/audichuang/aghub/releases/download/v#{version}/aghub-cli-aarch64-apple-darwin.tar.gz"
                        sha256 "${AGENT_MAC_ARM_SHA}"
                      else
                        url "https://github.com/audichuang/aghub/releases/download/v#{version}/aghub-cli-x86_64-apple-darwin.tar.gz"
                        sha256 "${AGENT_MAC_INTEL_SHA}"
                      end
                    end

                    on_linux do
                      if Hardware::CPU.intel?
                        url "https://github.com/audichuang/aghub/releases/download/v#{version}/aghub-cli-x86_64-unknown-linux-gnu.tar.gz"
                        sha256 "${AGENT_LINUX_SHA}"
                      end
                    end

                    def install
                      bin.install "aghub-cli"
                    end

                    test do
                      system "#{bin}/aghub-cli", "--version"
                    end
                  end
                  INNEREOF
                  # NOTE: download URLs + homepage below point at audichuang/aghub (this fork)

                  # Download Desktop assets to compute checksums
                  echo "Downloading Desktop App assets..."
                  wget -q "https://github.com/audichuang/aghub/releases/download/v${VERSION}/aghub_${VERSION}_x64.dmg" -O aghub_mac_intel.dmg || echo "Failed to download x64 dmg"
                  wget -q "https://github.com/audichuang/aghub/releases/download/v${VERSION}/aghub_${VERSION}_aarch64.dmg" -O aghub_mac_arm.dmg || echo "Failed to download aarch64 dmg"

                  AGHUB_MAC_INTEL_SHA=$(sha256sum aghub_mac_intel.dmg | awk '{print $1}')
                  AGHUB_MAC_ARM_SHA=$(sha256sum aghub_mac_arm.dmg | awk '{print $1}')

                  mkdir -p tap/Casks
                  cat << INNEREOF > tap/Casks/aghub.rb
                  cask "aghub" do
                    arch arm: "aarch64", intel: "x64"

                    version "${VERSION}"
                    sha256 arm:   "${AGHUB_MAC_ARM_SHA}",
                           intel: "${AGHUB_MAC_INTEL_SHA}"

                    url "https://github.com/audichuang/aghub/releases/download/v#{version}/aghub_#{version}_#{arch}.dmg"
                    name "aghub"
                    desc "AI coding agent configuration management tool (Desktop App)"
                    homepage "https://github.com/audichuang/aghub"

                    app "aghub.app"

                    zap trash: [
                      "~/Library/Application Support/com.akrc.aghub",
                      "~/Library/Preferences/com.akrc.aghub.plist",
                      "~/Library/Saved Application State/com.akrc.aghub.savedState"
                    ]
                  end
                  INNEREOF

            - name: Commit and Push
              run: |
                  cd tap
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/aghub-cli.rb Casks/aghub.rb
                  git commit -m "Update Homebrew formula and cask for aghub ${RELEASE_TAG}" || echo "No changes to commit"
                  git push

    # Belt-and-suspenders for pre-releases (vX.Y.Z-rc.N): explicitly re-assert
    # the GitHub Release as a prerelease and NOT "latest", after all build/upload
    # steps. A release builder can flip the prerelease flag back to false (orca
    # hit exactly this — an RC briefly became "latest"), which would let the
    # Tauri updater (endpoint = releases/latest/download/latest.json) push the RC
    # to every installed stable app. Gating on the tag shape, not the flag, is
    # the robust contract.
    finalize-prerelease:
        name: Mark RC as prerelease (not latest)
        needs: [build-tauri, build-cli]
        # !cancelled(): run even when a build job failed — a builder may have
        # already flipped the release to latest before the failure, and skipping
        # this job would leave the RC pinned at releases/latest (which the Tauri
        # updater serves to every stable user).
        if: ${{ !cancelled() && contains(github.event.inputs.version || github.ref_name, '-') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Force prerelease + not-latest
              run: |
                  gh release edit "$RELEASE_TAG" \
                      --repo "${{ github.repository }}" \
                      --prerelease \
                      --latest=false
