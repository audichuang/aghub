[workspace]
members = [
	"crates/agents",
	"crates/core",
	"crates/cli",
	"crates/api",
	"crates/skills-sh",
	"crates/skill",
	"crates/skill-audit",
	"crates/skill-update",
	"crates/git",
	"crates/json",
	"crates/markdown",
	"crates/inference",
	"crates/cc-plugins",
	"crates/remote",
	"crates/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2021"
authors = [ "audichuang" ]
license = "MIT"
repository = "https://github.com/audichuang/aghub"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = [ "derive" ] }
serde_json = { version = "1.0", features = [ "preserve_order" ] }
jsonc-parser = { version = "0.32.4", features = [
	"cst",
	"serde",
	"serde_json",
] }
thiserror = "2.0"
dirs = "6.0"
ts-rs = "12.0.1"

# CLI dependencies
clap = { version = "4.5", features = [ "derive" ] }
tabled = "0.20"
anyhow = "1.0"
colored = "3.0"

# HTTP dependencies
# gzip: GitHub serves recursive-tree JSON uncompressed otherwise (measured
# 3.8 MB -> 588 KB on a large repo). Feature-unified across every reqwest
# consumer in the graph, so it must live here rather than in one crate.
reqwest = { version = "0.13", features = [ "json", "gzip" ] }
url = "2.5"
base64 = "0.22"

# Skill security audit. yara-x is a git rev (no crates.io release with the
# feature set we compile against); default-features off keeps the modules we
# do not use — and their C deps — out of the build.
yara-x = { git = "https://github.com/VirusTotal/yara-x", rev = "e0096cd41fe16be76ca5321618ac880d1894b086", default-features = false, features = [ "constant-folding", "exact-atoms", "fast-regexp" ] }

# Testing dependencies
tempfile = "3.10"
assert_cmd = "2.2"
predicates = "3.1"

# YAML parsing
serde_yaml = "0.9"

# TOML parsing
toml = "1.0"
toml_edit = "0.25"

# FFI (O_NOFOLLOW for hardened file I/O)
libc = "0.2"

# Interactive CLI
inquire = "0.9"

# Git hooks
cargo-husky = { version = "1", default-features = false, features = [
	"precommit-hooks",
	"run-cargo-test",
] }
